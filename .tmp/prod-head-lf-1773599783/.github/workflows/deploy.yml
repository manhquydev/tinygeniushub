name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/cungcontuhoc
            
            # 1. Stop the application to free up memory (Memory-Safe Deployment)
            pm2 stop cungcontuhoc
            
            # 2. Pull latest code, install dependencies, and build
            git pull
            pnpm install
            pnpm build
            
            # 3. Run database migrations and seed
            pnpm db:migrate
            pnpm db:seed
            
            # 4. Start the application again
            pm2 start cungcontuhoc
