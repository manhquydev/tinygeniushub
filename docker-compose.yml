services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tinygeniushub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port defaults to 5433 to avoid clashing with a system Postgres on 5432.
      # Override with POSTGRES_HOST_PORT; container-internal port stays 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tinygeniushub"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      # Host port defaults to 6380 to avoid clashing with a system Redis on 6379.
      # Override with REDIS_HOST_PORT; container-internal port stays 6379.
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tinygeniushub?schema=public
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-this-in-production-32}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-this-in-production-32}
      COURSE_PAYMENT_PROVIDER: ${COURSE_PAYMENT_PROVIDER:-mock_gateway}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_API_BASE_URL: ${PAYOS_API_BASE_URL:-https://api-merchant.payos.vn}
      MOCK_UPLOAD_SIGNING_SECRET: dev-mock-upload-signing-secret-change-this-32
      BILLING_WEBHOOK_SECRET: dev-webhook-secret
      CRON_SECRET: dev-cron-secret-change-this-123456
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      COREPACK_DEFAULT_TO_LATEST: "0"
      RUN_DB_SEED: "true"
      SEED_PARENT_EMAIL: demo.parent@tinygeniushubvn.tech
      SEED_PARENT_PASSWORD: DemoPass123!
    command:
      ["/app/scripts/start-web.sh"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - app_internal
      - app_public

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${DOCKER_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tinygeniushub?schema=public
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-this-in-production-32}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-change-this-in-production-32}
      COURSE_PAYMENT_PROVIDER: ${COURSE_PAYMENT_PROVIDER:-mock_gateway}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_API_BASE_URL: ${PAYOS_API_BASE_URL:-https://api-merchant.payos.vn}
      MOCK_UPLOAD_SIGNING_SECRET: dev-mock-upload-signing-secret-change-this-32
      BILLING_WEBHOOK_SECRET: dev-webhook-secret
      CRON_SECRET: dev-cron-secret-change-this-123456
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      COREPACK_DEFAULT_TO_LATEST: "0"
    command:
      ["/app/scripts/start-worker.sh"]
    networks:
      - app_internal

volumes:
  postgres_data:

networks:
  app_internal:
    internal: true
  app_public:
