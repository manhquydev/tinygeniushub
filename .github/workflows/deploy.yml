name: Deploy to Production (No SSH Manual)

# Internal-dev: GitHub-disabled. Do not auto-deploy after Release Check.
# Re-enable only for an intentional one-shot via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: "main"
      health_probe_count:
        description: "How many external health probes after deploy"
        required: false
        default: "10"

concurrency:
  group: deploy-production-tinygeniushub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, production]
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}
      PROD_PUBLIC_BASE_URL: ${{ vars.PROD_PUBLIC_BASE_URL }}
      DEPLOY_ENV_FILE: .env.production
      INPUT_REF: ${{ inputs.ref }}
      INPUT_HEALTH_PROBE_COUNT: ${{ inputs.health_probe_count }}
    steps:
      - name: Resolve deployment variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          deploy_ref="${INPUT_REF:-main}"
          probe_count="${INPUT_HEALTH_PROBE_COUNT:-10}"

          app_dir="${PROD_APP_DIR:-/var/www/tinygeniushub}"
          public_base_url="${PROD_PUBLIC_BASE_URL:-https://www.tinygeniushubvn.tech}"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          log_dir="${RUNNER_TEMP}/deploy-logs"
          log_path="${log_dir}/deploy-${ts}.log"
          status_path="${log_dir}/pm2-status-${ts}.txt"

          mkdir -p "${log_dir}"

          echo "deploy_ref=${deploy_ref}" >> "$GITHUB_OUTPUT"
          echo "probe_count=${probe_count}" >> "$GITHUB_OUTPUT"
          echo "app_dir=${app_dir}" >> "$GITHUB_OUTPUT"
          echo "public_base_url=${public_base_url}" >> "$GITHUB_OUTPUT"
          echo "log_path=${log_path}" >> "$GITHUB_OUTPUT"
          echo "status_path=${status_path}" >> "$GITHUB_OUTPUT"

      - name: Preflight checks
        shell: bash
        run: |
          set -euo pipefail
          app_dir="${{ steps.vars.outputs.app_dir }}"
          test -d "${app_dir}" || { echo "::error::APP_DIR not found: ${app_dir}"; exit 1; }
          command -v node >/dev/null || { echo "::error::node not found on runner"; exit 1; }
          command -v pnpm >/dev/null || { echo "::error::pnpm not found on runner"; exit 1; }
          command -v pm2 >/dev/null || { echo "::error::pm2 not found on runner"; exit 1; }
          command -v pg_dump >/dev/null || { echo "::error::pg_dump not found on runner"; exit 1; }
          command -v pg_restore >/dev/null || { echo "::error::pg_restore not found on runner"; exit 1; }
          test -f "${app_dir}/scripts/deploy/remote-deploy.sh" || {
            echo "::error::Missing deploy script at ${app_dir}/scripts/deploy/remote-deploy.sh"
            exit 1
          }

          node_major="$(node -p "process.versions.node.split('.')[0]")"
          if [[ "${node_major}" -lt 22 ]]; then
            echo "::error::Runner Node.js ${node_major} is unsupported; require >=22"
            exit 1
          fi

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          app_dir="${{ steps.vars.outputs.app_dir }}"
          deploy_ref="${{ steps.vars.outputs.deploy_ref }}"
          log_path="${{ steps.vars.outputs.log_path }}"

          cd "${app_dir}"
          bash scripts/deploy/remote-deploy.sh "${deploy_ref}" 2>&1 | tee "${log_path}"

      - name: Process and readiness checks
        shell: bash
        run: |
          set -euo pipefail
          status_path="${{ steps.vars.outputs.status_path }}"
          app_dir="${{ steps.vars.outputs.app_dir }}"

          pm2 status | tee "${status_path}"

          # Process name check is explicit to prevent false-positive deploy.
          pm2 describe tinygeniushub-web >/dev/null
          pm2 describe tinygeniushub-worker >/dev/null

          wait_for_health() {
            local url="$1"
            local max_attempts="${2:-20}"
            local attempt=1

            until curl -fsS "$url" >/dev/null; do
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "::error::Health check failed after ${max_attempts} attempts: ${url}"
                return 1
              fi
              sleep 1
              attempt=$((attempt + 1))
            done
          }

          wait_for_health "http://127.0.0.1:3000/api/health" 25
          wait_for_health "http://127.0.0.1:3000/api/health/ready" 25

          cd "${app_dir}"
          pnpm prisma migrate status

      - name: External health probes
        shell: bash
        run: |
          set -euo pipefail
          probe_count="${{ steps.vars.outputs.probe_count }}"
          public_base_url="${{ steps.vars.outputs.public_base_url }}"

          # Ensure numeric probe count with sane default.
          if ! [[ "${probe_count}" =~ ^[0-9]+$ ]]; then
            probe_count="10"
          fi
          if [[ "${probe_count}" -lt 1 ]]; then
            probe_count="1"
          fi
          if [[ "${probe_count}" -gt 30 ]]; then
            probe_count="30"
          fi

          ok=0
          for _ in $(seq 1 "${probe_count}"); do
            curl -fsS "${public_base_url}/" >/dev/null
            ok=$((ok + 1))
            sleep 1
          done
          echo "external_probes_ok=${ok}/${probe_count}"

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log_path="${{ steps.vars.outputs.log_path }}"
          status_path="${{ steps.vars.outputs.status_path }}"
          deploy_ref="${{ steps.vars.outputs.deploy_ref }}"
          app_dir="${{ steps.vars.outputs.app_dir }}"
          public_base_url="${{ steps.vars.outputs.public_base_url }}"

          echo "## Production Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: Self-hosted runner (no manual SSH)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy ref: \`${deploy_ref}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- App dir: \`${app_dir}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public URL: ${public_base_url}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Log file: \`${log_path}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PM2 snapshot: \`${status_path}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deploy-production-runner-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ steps.vars.outputs.log_path }}
            ${{ steps.vars.outputs.status_path }}
