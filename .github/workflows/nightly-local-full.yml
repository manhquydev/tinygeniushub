name: Nightly Local Full

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-local-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-full-regression:
    name: local-full-regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tinygeniushub?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: nightly-session-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_SECRET: nightly-better-auth-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BILLING_WEBHOOK_SECRET: nightly-webhook-secret
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full local regression
        env:
          E2E_ADMIN_EMAIL: demo.admin@tinygeniushubvn.tech
          E2E_ADMIN_PASSWORD: DemoAdmin123!
        run: pnpm test:local:full
