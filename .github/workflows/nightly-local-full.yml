name: Nightly Local Full

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-local-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-full-regression:
    name: local-full-regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tinygeniushub?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: nightly-session-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_SECRET: nightly-better-auth-secret-with-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BILLING_WEBHOOK_SECRET: nightly-webhook-secret
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full local regression
        env:
          E2E_ADMIN_EMAIL: demo.admin@tinygeniushubvn.tech
          E2E_ADMIN_PASSWORD: DemoAdmin123!
        run: pnpm test:local:full
