name: Deploy DigitalOcean via SSH (Fallback)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: "main"
      dry_run:
        description: "Run SSH connectivity check only"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production-tinygeniushub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_REF: ${{ inputs.ref }}
      APP_DIR: /var/www/tinygeniushub
      SSH_USER: root
      SSH_PORT: "22"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Validate required secrets
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in DO_SSH_HOST DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare SSH key material
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/do_deploy_key
          chmod 600 ~/.ssh/do_deploy_key
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -p "${{ env.SSH_PORT }}" \
            -i ~/.ssh/do_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ env.SSH_USER }}@$DO_SSH_HOST" \
            "echo 'SSH connection established'"

      - name: Deploy on remote server
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          DEPLOY_REF: ${{ env.DEPLOY_REF }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.GA4_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          GA4_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GA4_SOT_REQUIRED: ${{ secrets.GA4_SOT_REQUIRED }}
        run: |
          set -euo pipefail
          POST_DEPLOY_SCRIPT=$'set -euo pipefail\npm2 restart tinygeniushub-web --update-env || pm2 start tinygeniushub-web\npm2 describe tinygeniushub-web >/dev/null\npm2 restart tinygeniushub-worker --update-env || pm2 start tinygeniushub-worker\npm2 describe tinygeniushub-worker >/dev/null\nfor url in http://127.0.0.1:3000/api/health http://127.0.0.1:3000/api/health/ready; do\n  ready=0\n  for _ in $(seq 1 20); do\n    if curl -fsS \"$url\" >/dev/null; then\n      ready=1\n      break\n    fi\n    sleep 1\n  done\n  if [[ \"$ready\" -ne 1 ]]; then\n    echo \"[deploy] health check failed: $url\"\n    exit 1\n  fi\ndone'
          POST_CMD_B64="$(printf '%s' "$POST_DEPLOY_SCRIPT" | base64 -w0)"
          GA4_PROPERTY_ID_B64="$(printf '%s' "${GA4_PROPERTY_ID:-}" | base64 -w0)"
          GA4_SERVICE_ACCOUNT_CLIENT_EMAIL_B64="$(printf '%s' "${GA4_SERVICE_ACCOUNT_CLIENT_EMAIL:-}" | base64 -w0)"
          GA4_SERVICE_ACCOUNT_PRIVATE_KEY_B64="$(printf '%s' "${GA4_SERVICE_ACCOUNT_PRIVATE_KEY:-}" | base64 -w0)"
          GA4_SOT_REQUIRED_B64="$(printf '%s' "${GA4_SOT_REQUIRED:-}" | base64 -w0)"

          ssh \
            -p "${{ env.SSH_PORT }}" \
            -i ~/.ssh/do_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ env.SSH_USER }}@$DO_SSH_HOST" "bash -s" <<REMOTE_SCRIPT
          set -euo pipefail
          cd "${{ env.APP_DIR }}"
          test -f scripts/deploy/remote-deploy.sh || {
            echo "Missing scripts/deploy/remote-deploy.sh in APP_DIR=${{ env.APP_DIR }}"
            exit 1
          }
          if [[ -n '$GA4_PROPERTY_ID_B64' ]]; then
            export GA4_PROPERTY_ID="\$(printf '%s' '$GA4_PROPERTY_ID_B64' | base64 -d)"
          fi
          if [[ -n '$GA4_SERVICE_ACCOUNT_CLIENT_EMAIL_B64' ]]; then
            export GA4_SERVICE_ACCOUNT_CLIENT_EMAIL="\$(printf '%s' '$GA4_SERVICE_ACCOUNT_CLIENT_EMAIL_B64' | base64 -d)"
          fi
          if [[ -n '$GA4_SERVICE_ACCOUNT_PRIVATE_KEY_B64' ]]; then
            export GA4_SERVICE_ACCOUNT_PRIVATE_KEY="\$(printf '%s' '$GA4_SERVICE_ACCOUNT_PRIVATE_KEY_B64' | base64 -d)"
          fi
          if [[ -n '$GA4_SOT_REQUIRED_B64' ]]; then
            export GA4_SOT_REQUIRED="\$(printf '%s' '$GA4_SOT_REQUIRED_B64' | base64 -d)"
          fi
          export POST_DEPLOY_CMD="\$(printf '%s' '$POST_CMD_B64' | base64 -d)"
          bash scripts/deploy/remote-deploy.sh "$DEPLOY_REF"
          REMOTE_SCRIPT
