name: Deploy DigitalOcean via SSH

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: "main"
      dry_run:
        description: "Run SSH connectivity check only"
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows:
      - Release Check
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-digitalocean-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
      APP_DIR: /var/www/cungcontuhoc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Validate required secrets
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in DO_SSH_HOST DO_SSH_USER DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare SSH key material
        env:
          DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > ~/.ssh/do_deploy_key
          chmod 600 ~/.ssh/do_deploy_key
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/do_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DO_SSH_USER@$DO_SSH_HOST" \
            "echo 'SSH connection established'"

      - name: Deploy on remote server
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          DO_SSH_HOST: ${{ secrets.DO_SSH_HOST }}
          DO_SSH_USER: ${{ secrets.DO_SSH_USER }}
          DEPLOY_REF: ${{ env.DEPLOY_REF }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.GA4_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          GA4_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GA4_SOT_REQUIRED: ${{ secrets.GA4_SOT_REQUIRED }}
        run: |
          set -euo pipefail
          POST_CMD_B64="$(printf '%s' 'pm2 restart cungcontuhoc --update-env || pm2 start cungcontuhoc' | base64 -w0)"
          GA4_PROPERTY_ID_B64="$(printf '%s' "${GA4_PROPERTY_ID:-}" | base64 -w0)"
          GA4_SERVICE_ACCOUNT_CLIENT_EMAIL_B64="$(printf '%s' "${GA4_SERVICE_ACCOUNT_CLIENT_EMAIL:-}" | base64 -w0)"
          GA4_SERVICE_ACCOUNT_PRIVATE_KEY_B64="$(printf '%s' "${GA4_SERVICE_ACCOUNT_PRIVATE_KEY:-}" | base64 -w0)"
          GA4_SOT_REQUIRED_B64="$(printf '%s' "${GA4_SOT_REQUIRED:-}" | base64 -w0)"

          ssh \
            -i ~/.ssh/do_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DO_SSH_USER@$DO_SSH_HOST" "bash -s" <<REMOTE_SCRIPT
          set -euo pipefail
          cd "${{ env.APP_DIR }}"
          test -f scripts/deploy/remote-deploy.sh || {
            echo "Missing scripts/deploy/remote-deploy.sh in APP_DIR=${{ env.APP_DIR }}"
            exit 1
          }
          if [[ -n '$GA4_PROPERTY_ID_B64' ]]; then
            export GA4_PROPERTY_ID="\$(printf '%s' '$GA4_PROPERTY_ID_B64' | base64 -d)"
          fi
          if [[ -n '$GA4_SERVICE_ACCOUNT_CLIENT_EMAIL_B64' ]]; then
            export GA4_SERVICE_ACCOUNT_CLIENT_EMAIL="\$(printf '%s' '$GA4_SERVICE_ACCOUNT_CLIENT_EMAIL_B64' | base64 -d)"
          fi
          if [[ -n '$GA4_SERVICE_ACCOUNT_PRIVATE_KEY_B64' ]]; then
            export GA4_SERVICE_ACCOUNT_PRIVATE_KEY="\$(printf '%s' '$GA4_SERVICE_ACCOUNT_PRIVATE_KEY_B64' | base64 -d)"
          fi
          if [[ -n '$GA4_SOT_REQUIRED_B64' ]]; then
            export GA4_SOT_REQUIRED="\$(printf '%s' '$GA4_SOT_REQUIRED_B64' | base64 -d)"
          fi
          export POST_DEPLOY_CMD="\$(printf '%s' '$POST_CMD_B64' | base64 -d)"
          bash scripts/deploy/remote-deploy.sh "$DEPLOY_REF"
          REMOTE_SCRIPT
